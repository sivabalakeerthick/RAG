<div class="not-found-container">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <mat-card class="not-found-card">
    <div class="card-header">
      <div class="error-badge">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>
      <span class="status-code">404 Error</span>
    </div>

    <h1>Page Not Found</h1>
    <h2>The page you are looking for doesn't exist or has been moved.</h2>

    <p>
      The knowledge path or URL you requested could not be located in our index. 
      Please check the web address or navigate back to the primary workspace.
    </p>

    <div class="action-buttons">
      <button class="primary-btn" (click)="goHome()">
        <i class="fa-solid fa-house"></i>
        <span>Return to Home Workspace</span>
      </button>
    </div>

    <div class="system-footer">
      <i class="fa-solid fa-circle-nodes"></i>
      <span>CogniDoc Intelligence Routing System</span>
    </div>
  </mat-card>
</div>
